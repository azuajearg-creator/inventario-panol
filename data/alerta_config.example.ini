# alerta_config.example.ini
# Copie este archivo como data/alerta_config.ini y complete sus datos.
# data/alerta_config.ini NO se sube al repositorio (está en .gitignore).
#
# Cómo obtener la contraseña de aplicación de Gmail:
#   1. Ir a myaccount.google.com
#   2. Seguridad -> Verificación en dos pasos (debe estar activa)
#   3. Contraseñas de aplicación -> Crear nueva -> Nombre: "Pañol"
#   4. Copiar las 16 letras generadas y pegarlas en app_password (sin espacios)
#
# Si app_password queda vacío solo se mostrará la notificación en Windows, sin email.

[email]
sender       =
recipient    =
app_password =
smtp_host    = smtp.gmail.com
smtp_port    = 587

# Recordatorio de devoluciones: avisar solo cuando se supera este umbral de días
[devoluciones]
dias_umbral  = 3
